services:

  web:
    build: .
    ports:
      - "8000:5000"
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MINIO_URL: ${MINIO_URL}
      # MINIO_PUBLIC_URL is the address the *browser* uses to load images.
      # Must be reachable from the host machine, not from inside Docker.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      MINIO_USR: ${MINIO_USR}
      MINIO_PWD: ${MINIO_PWD}
    depends_on:
      - mongo
      - minio

  mongo:
    image: mongo:7.0.32-rc1
    # volumes:
    #   - mongo_data:/data/db
    # Uncomment to access MongoDB from host (e.g. Compass):
    # ports:
    #   - "27017:27017"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API — browser loads images through this
      - "9001:9001"   # MinIO web console
    environment:
      MINIO_ROOT_USER: ${MINIO_USR}
      MINIO_ROOT_PASSWORD: ${MINIO_PWD}
    # volumes:
    #   - minio_data:/data

# volumes:
#   mongo_data:
#   minio_data:
