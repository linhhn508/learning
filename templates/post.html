{% extends 'base.html' %}

{% block title %} {{ post['title'] }} - FlaskBlog {% endblock %}

{% block content %}
    <div class="card shadow-sm border-0 mt-4">
        <div class="card-body p-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="card-title text-dark mb-0">{{ post['title'] }}</h1>
                <a href="{{ url_for('edit', post_id=post['id']) }}" class="btn btn-outline-warning btn-sm">Edit Post</a>
            </div>
            
            {% if post['created'] %}
                <span class="badge badge-info mb-4">{{ post['created'] }}</span>
            {% else %}
                <span class="badge badge-secondary mb-4">No Date</span>
            {% endif %}
            
            <hr>
            
            <div class="card-text mt-4" style="font-size: 1.15rem; line-height: 1.7; color: #444;">
                <p class="preserve-lines">{{ post['content'] }}</p>
            </div>
        </div>
        
        <div class="card-footer bg-white border-0 pb-4 px-5">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">&larr; Back to Home</a>
        </div>
    </div>
{% endblock %}
