{% extends 'base.html' %}

{% block content %}
<h1>{% block title %} Create a New Post {% endblock %}</h1>

<form method="post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="titleInput" name="title"
               placeholder="Post title" class="form-control"
               value="{{ request.form['title'] }}" maxlength="120">
        <small class="form-text text-muted text-right">
            <span id="charCount">0</span> / 120
        </small>
    </div>

    <div class="form-group">
        <label for="content">Content</label>
        <textarea name="content" 
              placeholder="Write your amazing post here..."
              class="form-control input-content">{{ request.form['content'] }}</textarea>
    </div>
    <div class="form-group d-flex">
        <button type="submit" class="btn btn-primary mr-2">&#10003; Publish Post</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">&#8592; Cancel</a>
    </div>
</form>

<script>
    // Title character counter
    const titleInput = document.getElementById('titleInput');
    const charCount = document.getElementById('charCount');
    // Initialise on page load (e.g. after a failed validation redirect)
    charCount.textContent = titleInput.value.length;
    titleInput.addEventListener('input', function () {
        charCount.textContent = this.value.length;
    });
</script>
{% endblock %}
